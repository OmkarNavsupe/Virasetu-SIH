<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="clayPot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="40%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Warm Earth Studio Background -->
  <rect width="600" height="400" fill="url(#terracottaBg)"/>
  
  <!-- Workshop Floor -->
  <rect x="0" y="320" width="600" height="80" fill="#78350F"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#451A03" stroke-width="3"/>

  <!-- Traditional Potter's Wheel (Chak) -->
  <ellipse cx="300" cy="330" rx="160" ry="32" fill="url(#wheelGrad)" stroke="#0F172A" stroke-width="4"/>
  <ellipse cx="300" cy="330" rx="140" ry="26" fill="#334155"/>
  <circle cx="300" cy="330" r="12" fill="#0F172A"/>
  <!-- Wheel Motion Radial Spokes -->
  <line x1="165" y1="330" x2="435" y2="330" stroke="#64748B" stroke-width="2"/>
  <line x1="205" y1="316" x2="395" y2="344" stroke="#64748B" stroke-width="2"/>
  <line x1="205" y1="344" x2="395" y2="316" stroke="#64748B" stroke-width="2"/>

  <!-- Master Potter's Hands Shaping Wet Clay Pot on Wheel -->
  <!-- Main Terracotta Matka Being Thrown -->
  <path d="M 260 325 C 230 290 230 220 270 180 C 275 160 265 150 275 140 L 325 140 C 335 150 325 160 330 180 C 370 220 370 290 340 325 Z" fill="url(#clayPot)" stroke="#431407" stroke-width="3"/>
  <!-- Pot Rim (Mouth) -->
  <ellipse cx="300" cy="140" rx="28" ry="8" fill="#EA580C" stroke="#431407" stroke-width="2"/>
  <ellipse cx="300" cy="140" rx="20" ry="5" fill="#431407"/>

  <!-- Potter's Hands -->
  <!-- Left Hand -->
  <path d="M 200 240 C 220 235 245 220 252 205 C 255 220 240 245 220 260 Z" fill="#FED7AA" stroke="#78350F" stroke-width="2"/>
  <!-- Right Hand -->
  <path d="M 400 240 C 380 235 355 220 348 205 C 345 220 360 245 380 260 Z" fill="#FED7AA" stroke="#78350F" stroke-width="2"/>

  <!-- Finished Terracotta Vessels on the Left (Traditional Kulhad and Diya) -->
  <!-- Kulhad (Tea Cup) -->
  <polygon points="90,320 100,270 130,270 140,320" fill="url(#clayPot)" stroke="#431407" stroke-width="2"/>
  <ellipse cx="115" cy="270" rx="15" ry="4" fill="#EA580C" stroke="#431407" stroke-width="1.5"/>
  <!-- Diya (Oil Lamp) -->
  <path d="M 80 340 C 80 325 120 325 130 315 C 130 330 110 345 80 340 Z" fill="#C2410C" stroke="#431407" stroke-width="2"/>
  <circle cx="128" cy="314" r="3" fill="#F59E0B"/>

  <!-- Decorative Painted Terracotta Urn on Right -->
  <path d="M 480 320 C 460 290 460 250 490 220 L 510 220 C 540 250 540 290 520 320 Z" fill="url(#clayPot)" stroke="#431407" stroke-width="2"/>
  <!-- White slip floral motifs on urn -->
  <path d="M 480 270 Q 500 260 520 270" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <circle cx="500" cy="285" r="4" fill="#FFFFFF"/>

  <!-- Title Watermark -->
  <text x="40" y="50" font-family="sans-serif" font-size="20" font-weight="bold" fill="#78350F" letter-spacing="1">TRADITIONAL POTTERY</text>
  <text x="40" y="72" font-family="sans-serif" font-size="13" fill="#9A3412">Pan-India Craft Guilds • Wheel-Thrown Terracotta & Indigenous Clay Art</text>
</svg>
