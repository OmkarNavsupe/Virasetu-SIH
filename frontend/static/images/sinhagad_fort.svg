<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sinhaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="cliffBasalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Mountain Sky -->
  <rect width="600" height="400" fill="url(#sinhaSky)"/>
  <!-- Distant Sahyadri mountain ridges -->
  <path d="M 0 240 Q 120 180 250 220 T 600 210 L 600 400 L 0 400 Z" fill="#64748B" opacity="0.3"/>
  <path d="M 0 270 Q 180 200 350 250 T 600 240 L 600 400 L 0 400 Z" fill="#475569" opacity="0.45"/>
  
  <!-- Majestic Sinhagad isolated mountain peak -->
  <polygon points="50,400 180,180 340,160 480,210 580,400" fill="url(#cliffBasalt)"/>
  <!-- Basalt crags & terrain textures -->
  <path d="M 180 180 L 220 280 L 280 230 L 340 330 L 400 250 L 480 400" stroke="#0F172A" stroke-width="4" fill="none"/>
  
  <!-- Fortified Battlements on Mountain Rim -->
  <path d="M 190 182 L 330 162 L 450 202" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- Stone bastions and watchtowers -->
  <rect x="230" y="152" width="24" height="24" rx="2" fill="#1E293B"/>
  <rect x="310" y="142" width="28" height="28" rx="2" fill="#1E293B"/>
  <!-- Pune Darwaza Gateway Arch on ridge -->
  <path d="M 234 176 L 234 162 C 234 156 250 156 250 162 L 250 176 Z" fill="#E2E8F0"/>
  
  <!-- Tanaji Memorial / Flagpole -->
  <line x1="324" y1="142" x2="324" y2="90" stroke="#78350F" stroke-width="4"/>
  <polygon points="324,90 384,105 324,120" fill="#EA580C"/>
  <circle cx="324" cy="88" r="3" fill="#F59E0B"/>

  <!-- Foothill greenery -->
  <path d="M 0 350 Q 150 320 300 340 T 600 330 L 600 400 L 0 400 Z" fill="#15803D" opacity="0.75"/>
  <path d="M 0 380 Q 200 360 400 375 T 600 370 L 600 400 L 0 400 Z" fill="#166534"/>

  <!-- Title Watermark -->
  <text x="30" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0F172A" letter-spacing="1">SINHAGAD FORT</text>
  <text x="30" y="72" font-family="sans-serif" font-size="14" fill="#334155">Sahyadri Cliffs, Pune • 'Lion's Fort' 1670 CE</text>
</svg>
