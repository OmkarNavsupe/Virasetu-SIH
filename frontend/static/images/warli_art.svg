<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="geruBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Mud / Red Ochre (Geru) wall background -->
  <rect width="600" height="400" fill="#9A3412"/>
  
  <!-- Outer decorative geometric border -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="30" y="30" width="540" height="340" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Sacred Tree of Life (Center Left) -->
  <g stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="330" x2="200" y2="120" stroke-width="5"/>
    <!-- Branches -->
    <path d="M 200 240 Q 150 200 130 160"/>
    <path d="M 200 240 Q 250 200 270 160"/>
    <path d="M 200 190 Q 160 160 150 120"/>
    <path d="M 200 190 Q 240 160 250 120"/>
    <path d="M 200 140 Q 170 120 180 80"/>
    <path d="M 200 140 Q 230 120 220 80"/>
  </g>
  <!-- Tree Leaves (Geometric Triangles) -->
  <g fill="#FFFFFF">
    <polygon points="130,160 120,150 140,150"/>
    <polygon points="270,160 260,150 280,150"/>
    <polygon points="150,120 140,110 160,110"/>
    <polygon points="250,120 240,110 260,110"/>
    <polygon points="180,80 170,70 190,70"/>
    <polygon points="220,80 210,70 230,70"/>
    <polygon points="200,80 190,65 210,65"/>
    <circle cx="160" cy="170" r="4"/>
    <circle cx="240" cy="170" r="4"/>
    <circle cx="175" cy="130" r="4"/>
    <circle cx="225" cy="130" r="4"/>
  </g>

  <!-- Tarpa Dancer (Traditional Musical Horn Player) in center -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round">
    <!-- Tarpa Player Body (Two inverted triangles) -->
    <circle cx="380" cy="165" r="8"/>
    <polygon points="380,175 368,198 392,198"/>
    <polygon points="380,220 368,198 392,198"/>
    <!-- Legs -->
    <polyline points="372,220 366,242 360,242" stroke-width="2.5" fill="none"/>
    <polyline points="388,220 394,242 400,242" stroke-width="2.5" fill="none"/>
    <!-- Tarpa Instrument (Long curved horn) -->
    <path d="M 374 172 Q 330 150 310 120" stroke-width="5" fill="none"/>
    <circle cx="308" cy="118" r="9"/>
  </g>

  <!-- Dancing Villagers Holding Hands in Harmony -->
  <!-- Dancer 1 -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="440" cy="175" r="7"/>
    <polygon points="440,184 430,204 450,204"/>
    <polygon points="440,224 430,204 450,204"/>
    <polyline points="433,224 428,244 422,244" stroke-width="2.5" fill="none"/>
    <polyline points="447,224 452,244 458,244" stroke-width="2.5" fill="none"/>
    <polyline points="410,195 430,204 450,204 470,195" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Dancer 2 -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="490" cy="175" r="7"/>
    <polygon points="490,184 480,204 500,204"/>
    <polygon points="490,224 480,204 500,204"/>
    <polyline points="483,224 478,244 472,244" stroke-width="2.5" fill="none"/>
    <polyline points="497,224 502,244 508,244" stroke-width="2.5" fill="none"/>
    <polyline points="470,195 480,204 500,204 520,195" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Sun, Moon and Birds in Tribal Style -->
  <circle cx="100" cy="80" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 80 80 L 120 80 M 100 60 L 100 100 M 86 66 L 114 94 M 86 94 L 114 66" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Flying Birds -->
  <path d="M 280 70 Q 290 60 300 70 Q 310 60 320 70" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <path d="M 330 85 Q 340 75 350 85 Q 360 75 370 85" stroke="#FFFFFF" stroke-width="2" fill="none"/>

  <!-- Ground Line & Spiraling Patterns -->
  <line x1="50" y1="330" x2="550" y2="330" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="380" cy="300" r="25" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Title Watermark -->
  <text x="50" y="360" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FEF3C7" letter-spacing="1">WARLI PAINTING</text>
  <text x="320" y="360" font-family="sans-serif" font-size="14" fill="#FDE68A">North Sahyadri, Maharashtra • Sacred Tribal Folk Art</text>
</svg>
