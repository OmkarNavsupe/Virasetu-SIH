<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cottonCloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <!-- Natural Bleached Cotton Base -->
  <rect width="600" height="400" fill="url(#cottonCloth)"/>
  
  <!-- Intricate Paisley / Floral Border -->
  <rect x="25" y="25" width="550" height="350" fill="none" stroke="#78350F" stroke-width="3"/>
  <rect x="35" y="35" width="530" height="330" fill="none" stroke="#B91C1C" stroke-width="2"/>

  <!-- Kalamkari Bamboo Pen (Kalam) on Top Left -->
  <g transform="translate(100, 70) rotate(35)">
    <rect x="0" y="0" width="10" height="120" fill="#D97706" rx="2"/>
    <polygon points="0,120 10,120 5,145" fill="#78350F"/>
    <!-- Fermented iron ink reservoir cloth ball -->
    <ellipse cx="5" cy="115" rx="9" ry="12" fill="#1C1917"/>
    <!-- Ink droplet -->
    <circle cx="5" cy="155" r="3" fill="#1C1917"/>
  </g>

  <!-- Sacred Tree of Life with Organic Flowers & Peacocks -->
  <g stroke="#1C1917" stroke-width="2.5" fill="none">
    <!-- Main Curving Trunk -->
    <path d="M 300 365 Q 300 240 330 180 Q 360 120 300 80"/>
    <path d="M 330 220 Q 240 180 200 130"/>
    <path d="M 330 200 Q 420 170 450 120"/>
  </g>

  <!-- Large Srikalahasti Lotus Flower Bloom -->
  <g transform="translate(300, 80)">
    <path d="M 0 0 C -30 -30 -30 -60 0 -80 C 30 -60 30 -30 0 0 Z" fill="#DC2626" stroke="#1C1917" stroke-width="2"/>
    <path d="M -20 -15 C -50 -35 -40 -70 -15 -75 C 0 -60 -10 -30 -20 -15 Z" fill="#EA580C" stroke="#1C1917" stroke-width="1.5"/>
    <path d="M 20 -15 C 50 -35 40 -70 15 -75 C 0 -60 10 -30 20 -15 Z" fill="#EA580C" stroke="#1C1917" stroke-width="1.5"/>
    <circle cx="0" cy="-45" r="12" fill="#FBBF24" stroke="#1C1917" stroke-width="2"/>
  </g>

  <!-- Left Blooming Branch -->
  <g transform="translate(200, 130)">
    <circle cx="0" cy="0" r="28" fill="#1E3A8A" stroke="#1C1917" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
    <!-- Indigo Petals -->
    <path d="M 0 -28 C -15 -45 15 -45 0 -28" fill="#0284C7"/>
    <path d="M 0 28 C -15 45 15 45 0 28" fill="#0284C7"/>
    <path d="M -28 0 C -45 -15 -45 15 -28 0" fill="#0284C7"/>
    <path d="M 28 0 C 45 -15 45 15 28 0" fill="#0284C7"/>
  </g>

  <!-- Right Peacock Perched on Branch -->
  <g transform="translate(450, 130)">
    <!-- Peacock Body -->
    <ellipse cx="0" cy="0" rx="20" ry="14" fill="#0284C7" stroke="#1C1917" stroke-width="2"/>
    <circle cx="15" cy="-12" r="8" fill="#1E3A8A"/>
    <polygon points="22,-14 30,-12 22,-10" fill="#F59E0B"/>
    <!-- Ornate Tail Feather Feathers -->
    <path d="M -15 5 Q -40 20 -60 50 Q -30 40 -10 20 Z" fill="#15803D" stroke="#1C1917" stroke-width="1.5"/>
    <circle cx="-35" cy="25" r="5" fill="#F59E0B"/>
    <circle cx="-35" cy="25" r="2" fill="#1E3A8A"/>
  </g>

  <!-- Swirling Paisley Leaf Clusters -->
  <g fill="#15803D" stroke="#1C1917" stroke-width="1.5">
    <path d="M 280 250 C 250 230 240 200 260 190 C 290 180 300 230 280 250 Z"/>
    <path d="M 370 260 C 400 240 410 210 390 200 C 360 190 350 240 370 260 Z"/>
  </g>

  <!-- Title Watermark -->
  <text x="50" y="340" font-family="sans-serif" font-size="20" font-weight="bold" fill="#78350F" letter-spacing="1">KALAMKARI ART</text>
  <text x="50" y="358" font-family="sans-serif" font-size="13" fill="#B91C1C">Andhra Pradesh • Natural Vegetable Dyes, Bamboo Pen & Temple Epics</text>
</svg>
